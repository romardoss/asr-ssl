paths:
  common_voice: /mnt/data/rberehun/common-voice
  checkpoints: /mnt/data/rberehun/checkpoints

model:
  id: openai/whisper-medium
  name: model-whisper-uk
  language: uk

gpus:
  nvidia0: false
  nvidia1: true

batch_size:
  train: 32
  # для суто тренування 8 забирає 20гб відеопам'яті, можна більше але обережно
  # dev and the test after fine-tuning; the optimizer is still in memory
  testing_after_train: 8
  # evaluation/evaluate.py, no optimizer resident
  # для суто тестування 32 забирає 11гб відеопам'яті, можна більше
  # для суто тестування 64 забирає 15.1гб відеопам'яті, можна більше
  testing: 64

training:
  learning_rate: 0.00001
  warmup_steps: 50
  max_epochs: 2
  num_workers: 4
  precision: bf16-true
  seed: 42
  gradient_clip: 1.0
  weight_decay: 0.01
  resume: true
  baseline_eval: true
  # 1.0 means the whole split. An integer means that many batches.
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  limit_test_batches: 1.0
  checkpoint_every: 0.05

data:
  max_audio_seconds: 30.0
  max_label_tokens: 448

pseudo_labelling:
  teacher_model: /mnt/data/rberehun/checkpoints/model-whisper-uk/model-whisper-uk-epoch00.ckpt
  voa: /mnt/data/rberehun/voa-ukr
  ukrainian_meta: datasets/voa-ukr/ukrainian.csv
  timestamps: datasets/voa-ukr/ukrainian_30s.csv
  sample_rate: 16000
  batch_size: 64
  language: uk
  task: transcribe
  precision: bf16
  resume: true
  output_dir: output/pseudo-labelling

student:
  # Train on VOA slices. Dev during the epoch and the test after it are Common Voice.
  name: student_model-whisper-uk
  base: openai/whisper-medium
  init: openai/whisper-medium
  # latest uses the newest labels.csv / label_marks.csv for pseudo_labelling.teacher_model
  marks: latest
  labels: latest
  # false trains on every non-empty label and does not read marks
  filter_marks: true
  accepted_mark: [4, 5]
  voa: /mnt/data/rberehun/voa-ukr
  sample_rate: 16000
  language: uk
  eval_data: common_voice
  gpus:
    nvidia0: false
    nvidia1: true
  batch_size:
    train: 32
    eval: 8
  learning_rate: 0.00001
  warmup_steps: 50
  max_epochs: 2
  num_workers: 4
  precision: bf16-true
  seed: 42
  gradient_clip: 1.0
  weight_decay: 0.01
  resume: true
  baseline_eval: false
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  limit_test_batches: 1.0
  checkpoint_every: 0.25
  val_every: 0.25
  max_audio_seconds: 30.0
  max_label_tokens: 448

# run, skip, or skip_if_present. student and evaluate are run or skip.
# skip_if_present leaves a step out when its output file is already on disk:
# language -> pseudo_labelling.ukrainian_meta
# timestamps -> pseudo_labelling.timestamps
# label -> newest run under pseudo_labelling.output_dir already has labels.csv
# clean -> label_marks.csv beside those labels
pipeline:
  language: skip_if_present
  timestamps: skip_if_present
  label: skip_if_present
  clean: skip
  student: run
  evaluate: run
  chunk_processes: 6
  mms_model: facebook/mms-lid-256
  mms_batch_size: 16
  mms_fp16: true
  judge_workers: 4
  judge_retries: 3
  # OpenRouter model. The API key stays in .env. Empty is allowed only when clean does not run.
  judge_model: ""
