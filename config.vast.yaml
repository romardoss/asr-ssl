# vast.ai config. Select it for every command on the instance:
#   export ASR_CONFIG=config.vast.yaml
# It extends config.yaml and lists only what differs on vast.ai: data and checkpoints
# under /workspace, and VOA prep stages skipped because their outputs are already in git.
# Everything not listed here (training, student, mlflow, downloads, ...) comes from config.yaml.
# Mappings merge key by key; lists (data.train, multi_step.steps) are replaced whole.
# Relative paths resolve from the repo root.
#
# Expected layout on the instance (see VAST_AI.md):
#   /workspace/asr_ssl          this repo
#   /workspace/data/<dataset>   one directory per dataset (paths.data_root)
#   /workspace/checkpoints      teacher checkpoint and new runs
extends: config.yaml

paths:
  # Every dataset path in config.yaml is built from data_root; checkpoints do not live under it here.
  data_root: /workspace/data
  checkpoints: /workspace/checkpoints

model:
  name: model-whisper-uk

# Inside a vast.ai container the GPUs are numbered from 0. Rent a single-GPU instance:
# gpus keeps nvidia0 on and nvidia1 off, as in config.yaml.
#
# Batch sizes and precision are tuned on the original server (see training and student in config.yaml).
# bf16 needs an Ampere or newer GPU. On a 24 GB card lower batch_size.train and testing first
# and check with limit_train_batches.

data:
  train: [common_voice, fleurs, opentts, tg_voices, ukr_dialects]
  dev: [common_voice, fleurs, ukr_dialects]

student:
  accepted_mark: [0, 1, 2, 3, 4, 5]

multi_step:
  name: student_mix-m5-cv
  steps:
    - data: [pseudo, common_voice]
      accepted_mark: [5]

# language and timestamps are skip: ukrainian.csv and ukrainian_30s.csv are in git.
# label stays skip_if_present: copy labels.csv of the teacher into
# pseudo_labelling.output_dir first, or it relabels about 2000 hours of VOA.
# The single student run and its evaluation replace the multi_step chain here.
pipeline:
  language: skip
  timestamps: skip
  student: run
  evaluate: run
  multi_step: skip
